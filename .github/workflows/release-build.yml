name: Release Build

on:
  push:
    branches:
      - codex/improve-direction-visuals
    tags:
      - "1.0.0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore GameTools.sln

      - name: Build solution
        run: msbuild GameTools.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false

      - name: Package app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishRoot = Join-Path $env:RUNNER_TEMP "DeafAlsoPlayFps"
          $source = "DeafAlsoPlayFps/bin/Release/net480"
          if (-not (Test-Path $source)) {
            $source = "DeafAlsoPlayFps/bin/Release"
          }
          if (-not (Test-Path $source)) {
            throw "Release output directory was not found."
          }
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          Copy-Item -Path "$source/*" -Destination $publishRoot -Recurse -Force
          Compress-Archive -Path "$publishRoot/*" -DestinationPath "DeafAlsoPlayFps.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeafAlsoPlayFps
          path: DeafAlsoPlayFps.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('beta-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('DeafAlsoPlayFps {0}', github.ref_name) || format('DeafAlsoPlayFps beta {0}', github.run_number) }}
          body: |
            Build from ref `${{ github.ref_name }}`.
            Commit: `${{ github.sha }}`.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: DeafAlsoPlayFps.zip
